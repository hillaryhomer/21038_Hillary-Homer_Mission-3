<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Temukan koleksi video pembelajaran untuk mengembangkan keterampilanmu bersama videobelajar."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%233ecf40'/%3E%3Cpath d='M16 11L30 20L16 29Z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><title>videobelajar — Masuk ke Akun</title></head><body><header class="header"><nav class="nav" aria-label="Navigasi utama"><a class="logo" href="index.html" aria-label="videobelajar beranda">video<span>belajar</span></a></nav></header><main class="auth-main"><section class="auth-card"><h1>Masuk ke Akun</h1><p class="auth-intro">Yuk, lanjutin belajarmu di videobelajar.</p><form id="auth-form" data-mode="login"><div class="field"><label for="email">E-Mail <span class="required">*</span></label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Kata Sandi <span class="required">*</span></label><div class="password-wrap"><input id="password" name="password" type="password" required autocomplete="current-password" minlength="8"><button type="button" class="eye" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><a href="#" class="forgot" id="forgot-password">Lupa Password?</a><div class="auth-actions"><button class="btn" type="submit">Masuk</button><a class="btn light" href="register.html">Daftar</a></div><p class="feedback" id="auth-feedback" role="status"></p></form><div class="divider">atau</div><button type="button" class="btn outline google" id="google-button"><span class="google-mark" aria-hidden="true">G</span>Masuk dengan Google</button><p class="demo-note">Demo tampilan: tidak membuat akun atau menyimpan kata sandi.</p></section></main><dialog id="forgot-dialog"><button class="dialog-close" aria-label="Tutup">×</button><h2>Lupa Password?</h2><p class="muted">Masukkan email untuk mencoba formulir pemulihan akun.</p><form id="reset-form"><div class="field"><label for="reset-email">E-Mail</label><input id="reset-email" type="email" required autocomplete="email"></div><button class="btn" type="submit">Kirim</button><p class="feedback" id="reset-feedback" role="status"></p></form></dialog></body></html>
